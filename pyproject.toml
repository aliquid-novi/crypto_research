[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadsim"
version = "0.1.0"
description = "A small, readable market simulator and backtester for spread trading research"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
plots = ["matplotlib"]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["spreadsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
